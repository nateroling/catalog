name: Publish

on:
  schedule:
    - cron: "17 * * * *" # hourly; GitHub may delay scheduled runs
  workflow_dispatch: {} # "Run workflow" button for publishing now
  push:
    branches: [main]
    paths-ignore: ["content/entries/**", "content/_data/catalog.json", "content/assets/img/**"]

permissions:
  contents: write # commit synced content
  pages: write
  id-token: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm test

      - name: Sync from Craft
        env:
          CRAFT_API_URL: ${{ secrets.CRAFT_API_URL }}
          CRAFT_API_TOKEN: ${{ secrets.CRAFT_API_TOKEN }}
          DOWNLOAD_IMAGES: "1"
        run: npm run sync

      - name: Commit content changes
        id: commit
        run: |
          git add content
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No content changes."
          else
            git config user.name "catalog-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Sync from Craft"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # Scheduled runs with no content change stop here; manual runs and code
      # pushes always rebuild.
      # Tells us where Pages serves the site: base_path is "/catalog" on the
      # github.io project URL and "" once a custom domain is set.
      - id: pages
        if: steps.commit.outputs.changed == 'true' || github.event_name != 'schedule'
        uses: actions/configure-pages@v5

      - name: Build
        if: steps.commit.outputs.changed == 'true' || github.event_name != 'schedule'
        env:
          PATH_PREFIX: ${{ steps.pages.outputs.base_path }}/
          SITE_URL: ${{ steps.pages.outputs.base_url }}
        run: npm run build

      - uses: actions/upload-pages-artifact@v3
        if: steps.commit.outputs.changed == 'true' || github.event_name != 'schedule'
        with:
          path: _site

      - id: deploy
        if: steps.commit.outputs.changed == 'true' || github.event_name != 'schedule'
        uses: actions/deploy-pages@v4
